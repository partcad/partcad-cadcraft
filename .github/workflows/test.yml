# This package's tests, in `tests/`: the scripts' own logic on its own, and the
# package used the way a workspace uses it, through PartCAD.
#
# Separate jobs because they answer separate questions. The first says whether
# the scripts are right, on every operating system CADCraft builds for -- the
# downloader picks a different archive on each, and this is the only place each
# of those choices is actually made. The second installs PartCAD and builds
# real parts and assemblies -- downloading CADCraft, or using the published
# image where PartCAD's `docker` sandbox picks it up -- and says whether this
# package still works with the PartCAD it is used with.
name: Test

on:
  workflow_dispatch:
    inputs:
      partcad:
        description: "The PartCAD to test against, as a pip requirement"
        default: "partcad @ git+https://github.com/partcad/partcad.git@devel"
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # PartCAD moves; this package does not. Running nightly against PartCAD's
    # development branch is what finds a change there that breaks this plugin
    # before a release ships it.
    - cron: "45 5 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The interpreter PartCAD runs a package's scripts on by default.
  PYTHON_VERSION: "3.11"
  # The PartCAD this package declares it needs ('partcad:' in partcad.yaml) is
  # on PartCAD's development branch ahead of a release that has it. Against an
  # older PartCAD the tests that go through it skip, saying why.
  PARTCAD: ${{ inputs.partcad || 'partcad @ git+https://github.com/partcad/partcad.git@devel' }}

jobs:
  scripts:
    name: "The scripts, without PartCAD (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install --force-reinstall --no-deps cadquery-ocp==7.9.3.1.1
      # Without PartCAD installed, the tests that need it skip themselves.
      - name: Test
        env:
          CADCRAFT_NETWORK_TESTS: "1"
        run: python -m pytest -m "not slow"

  partcad:
    name: "The package, through PartCAD"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install pytest "${PARTCAD}"
      - run: python -m pytest tests/test_partcad.py tests/test_package.py
